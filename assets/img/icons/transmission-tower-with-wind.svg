<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 120" role="img" aria-label="Transmission tower with wind" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Transmission tower with wind</title>
  <!-- Saved icon: "transmission tower with wind". As a stand-alone file it draws in green (#8fdc9f).
       To make it follow the site's light/dark colors, paste the <svg> inline in the HTML and give it class="opp-art"
       (see transmission-tower-with-wind-snippet.html). -->
  <style>
    .ic{color:#8fdc9f}
    .gust path{stroke-dasharray:6 7;animation:gust 2.8s linear infinite}
    .gust path:nth-child(2){animation-duration:2.2s}
    .gust path:nth-child(3){animation-duration:3.4s}
    @keyframes gust{to{stroke-dashoffset:-26}}
    .tower{transform-origin:106px 112px;animation:sway 4s ease-in-out infinite}
    @keyframes sway{0%,100%{transform:rotate(0)}50%{transform:rotate(1.6deg)}}
    @media (prefers-reduced-motion:reduce){.gust path,.tower{animation:none}}
  </style>
  <g class="ic" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <g class="tower" stroke-width="2.2">
      <path d="M96 112 L106 30 L116 112"/>
      <path d="M98 96 L114 96 M100 80 L112 80 M102 64 L110 64 M104 48 L108 48"/>
      <path d="M98 96 L112 80 L100 64 L110 48 M114 96 L100 80 L112 64 L102 48"/>
      <path d="M88 40 L124 40 M92 34 L120 34"/>
      <path d="M106 30 L106 22"/>
      <path d="M88 40 v6 M124 40 v6 M92 34 v6 M120 34 v6" stroke-width="1.6"/>
    </g>
    <g class="gust" stroke-width="2.6">
      <path d="M8 44 H58 c10 0 14-12 4-16 c-6-2-11 4-7 8"/>
      <path d="M4 66 H74 c12 0 16 13 5 18 c-7 3-13-3-9-8"/>
      <path d="M14 88 H52 c9 0 12-10 4-13"/>
    </g>
  </g>
</svg>
